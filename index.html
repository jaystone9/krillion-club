<style id="css">
/* Layout idea: a dive-computer readout. No cards: sections sit on the water, split by letterspaced labels and dashed rules. Hard edges, pixel numerals, one hot accent. Single theme by choice. */
:root{
  --sea:#0B1730; --abyss:#070D1F; --line:#22335A; --rule:#3A5088;
  --ink:#E8F1FF; --dim:#8497C2; --pink:#FF5C8A; --cyan:#4FD8F0; --gold:#FFD23F; --bad:#FF7A7A;
  --glow:var(--cyan); --lantern:var(--gold);
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,#35596C 0,#1D3653 200px,var(--sea) 520px,var(--abyss) 1300px) var(--abyss);background-repeat:no-repeat;color:var(--ink);font:400 14px/1.55 var(--body);min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#app{max-width:940px;margin:0 auto;padding:28px 18px 90px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 clamp(44px,11vw,84px)/.9 var(--display);text-transform:uppercase;letter-spacing:.03em;text-shadow:3px 0 var(--pink),-3px 0 var(--cyan)}
h2{font:600 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.3em;color:var(--ink);display:flex;align-items:center;gap:14px}
h2{white-space:nowrap}
.lab{position:absolute;left:50%;bottom:-50px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.lab b{font:600 9px/1 var(--body);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.lab i{font:500 15px/1 var(--display);font-style:normal;color:var(--c);white-space:nowrap}
h2::after{content:"";flex:1;border-top:1px dashed var(--rule);min-width:20px}
.row.between>h2{flex:1}
h3{font:600 11px/1.3 var(--body);text-transform:uppercase;letter-spacing:.2em;color:var(--gold)}
p{margin:0}
.dim{color:var(--dim)} .sm{font-size:12px} .num{font-variant-numeric:tabular-nums}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.head p{font-size:11px;text-transform:uppercase;letter-spacing:.24em;color:var(--cyan);margin-bottom:12px}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],textarea{background:var(--abyss);border:2px solid var(--line);border-radius:0;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:150px;resize:vertical}
button{cursor:pointer;border:2px solid var(--rule);background:#131F40;border-radius:0;padding:9px 16px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.16em;box-shadow:0 4px 0 #04081A}
button:hover{border-color:var(--cyan)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #04081A}
button.go{background:var(--pink);color:#22040F;border-color:var(--pink);box-shadow:0 4px 0 #94284B}
button.go:hover{filter:brightness(1.08)}
button.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;text-decoration:none;color:var(--dim);padding:10px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;border-bottom:3px solid transparent;margin-bottom:-1px}
nav a.on{color:var(--ink);border-bottom-color:var(--pink)}
nav a:not(.on):hover{color:var(--ink)}
.panel{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.scroll{overflow-x:auto}
.av{display:inline-grid;place-items:center;width:38px;height:38px;background:var(--sea);border:2px solid var(--c);box-shadow:3px 3px 0 color-mix(in srgb,var(--c) 40%,#000);font-size:19px;flex:none;overflow:hidden}
.av.s{width:28px;height:28px;font-size:14px;box-shadow:2px 2px 0 color-mix(in srgb,var(--c) 40%,#000)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
/* dive chart */
.sea{position:relative;height:460px;overflow:hidden;background:linear-gradient(180deg,#3A6076 0,#1C3654 9%,#0D1C3A 38%,var(--abyss) 100%);border:2px solid var(--line)}
.water{position:absolute;inset:40px 12px 60px 62px}
.tick{position:absolute;left:-62px;right:0;border-top:1px dashed rgba(132,151,194,.3)}
.tick span{position:absolute;left:8px;top:-8px;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.08em;text-transform:uppercase}
.ref{position:absolute;left:0;right:0;border-top:1px solid var(--c);opacity:.5}
.ref span{position:absolute;right:0;top:3px;font-size:10px;color:var(--c);letter-spacing:.1em;text-transform:uppercase}
.cols{position:absolute;inset:0;display:flex}
.col{flex:1;position:relative}
.rope{position:absolute;left:50%;top:0;width:0;border-left:1px solid var(--c);animation:rope 1.4s cubic-bezier(.2,.7,.2,1) backwards}
.diver{position:absolute;left:50%;transform:translate(-50%,-50%);animation:sink 1.4s cubic-bezier(.2,.7,.2,1) backwards;z-index:1}
.diver .av{width:46px;height:46px}
.diver b{font:600 10px/1.1 var(--body);white-space:nowrap;position:absolute;top:56px;left:50%;transform:translateX(-50%);text-transform:uppercase;letter-spacing:.1em}
.diver i{font:500 15px/1 var(--display);font-style:normal;color:var(--c);position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap}
@keyframes sink{from{top:0}} @keyframes rope{from{height:0}}
@media (prefers-reduced-motion:reduce){.rope,.diver{animation:none}}
/* leaderboard */
.lb{display:flex;flex-direction:column}
.lbrow{display:grid;grid-template-columns:34px 38px 1fr auto auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.rank{font:700 26px/1 var(--display);color:var(--dim)}
.lbrow:first-child .rank{color:var(--pink)}
.lbrow b{font-size:15px}
.big{font:700 30px/1 var(--display);text-align:right}
.lbrow:first-child .big{color:var(--gold)}
.big small{font:400 11px var(--body);color:var(--dim);letter-spacing:.1em}
.seg{display:inline-flex;border:2px solid var(--rule)}
.seg button{border:0;background:none;padding:7px 12px;color:var(--dim);box-shadow:none;letter-spacing:.12em}
.seg button:active{transform:none}
.seg button.on{background:var(--cyan);color:#04202A}
/* awards */
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.award{background:var(--sea);border:2px solid var(--line);border-top:4px solid var(--c,var(--cyan));padding:14px;display:flex;flex-direction:column;gap:8px}
.award .who{font:700 20px/1.1 var(--display);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick{display:flex;flex-direction:column;align-items:center;gap:14px}.pick .av{width:84px;height:84px;font-size:38px;border-width:3px;box-shadow:5px 5px 0 color-mix(in srgb,var(--c) 40%,#000)}.pick select{max-width:100%}
/* tables */
table{border-collapse:separate;border-spacing:4px;width:100%}
th{font:600 10px var(--body);color:var(--dim);text-align:center;padding:4px;white-space:nowrap;text-transform:uppercase;letter-spacing:.14em}
th.l,td.l{text-align:left}
td{text-align:center;padding:0}
td.l{padding-right:10px;white-space:nowrap}
.grade{padding:8px 4px;min-width:56px;background:color-mix(in srgb,var(--cyan) calc(var(--v)*.55%),var(--sea));border:1px solid var(--line)}
.grade b{display:block;font:700 20px/1 var(--display)}
.grade span{font-size:10px;color:var(--ink);opacity:.7;font-variant-numeric:tabular-nums}
.grade.top{outline:2px solid var(--gold);outline-offset:-1px}
.chip{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--sea);border:2px solid color-mix(in srgb,var(--c) 75%,transparent);font-size:16px;font-weight:600}
.chip.t{font-size:10px;color:var(--c)}
.chip.none{border-style:dashed;color:var(--dim);font-size:12px}
.mix{display:flex;gap:2px;height:18px;flex:1;min-width:120px}
.mix i{background:var(--c);min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;background:var(--c);margin-right:6px}
.tag{font-size:10px;border:1px solid var(--rule);padding:1px 7px;color:var(--cyan);white-space:nowrap;text-transform:uppercase;letter-spacing:.1em}
ol.prompts{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:8px}
ol.prompts li::marker{color:var(--dim)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.strip{position:relative}
.strip button{flex:none;min-width:52px;padding:7px 8px;text-align:center;font:700 16px var(--display);letter-spacing:0}
.strip button.on{background:var(--pink);border-color:var(--pink);color:#22040F;box-shadow:0 4px 0 #94284B}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px 14px;align-items:center;text-align:center}
.duel .v{font:700 24px var(--display);color:var(--dim)}
.duel .v.w{color:var(--ink)} .duel .v.w::after{content:" ◆";color:var(--pink);font-size:12px}
.duel>.sm{text-transform:uppercase;letter-spacing:.14em;font-size:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:36px}
.erow{display:grid;grid-template-columns:22px 1fr 160px;gap:8px;align-items:center}
.srow{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center}
.srow .pv{grid-column:2;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:18px;font-size:12px}
.err{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gold);color:#1C1500;padding:10px 16px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;z-index:9}
#toast.on{opacity:1}
@media (max-width:520px){.lab b{font-size:8px;letter-spacing:0}.lab i{font-size:13px}.lbrow{grid-template-columns:26px 38px 1fr auto;gap:10px}.lbrow svg{display:none}.big{font-size:24px}.erow{grid-template-columns:18px 1fr 108px}.srow{grid-template-columns:1fr}.srow .pv{grid-column:1}.water{left:50px;right:6px}.tick{left:-50px}.chip{width:30px;height:30px;font-size:14px}.diver .av{width:36px;height:36px}.diver b{top:46px;font-size:9px;letter-spacing:0}.diver i{top:58px;font-size:13px}.pick .av{width:64px;height:64px}}

/* leader + motion */
.lbrow{animation:rowin .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.lbrow:first-child{grid-template-columns:34px 68px 1fr auto auto;padding:18px 14px;margin-bottom:10px;border:2px solid var(--gold);background:linear-gradient(90deg,rgba(255,210,63,.16),rgba(255,210,63,0) 70%);box-shadow:6px 6px 0 rgba(255,210,63,.22)}
.lbrow:first-child .av{width:68px;height:68px;border-width:3px}
.lbrow:first-child b{font:700 24px/1.1 var(--display)}
.lbrow:first-child .big{font-size:44px}
.lbrow:first-child .rank{font-size:34px;color:var(--gold)}
.tag.lead{color:#1C1500;background:var(--gold);border-color:var(--gold);font-weight:600;vertical-align:middle}
.bub{position:absolute;bottom:-8px;width:var(--s);height:var(--s);background:rgba(190,225,255,.45);animation:rise var(--d) linear var(--dl) infinite}
h1{animation:glitch 7s steps(1) infinite}
@keyframes rowin{from{opacity:0;transform:translateX(-14px)}}
@keyframes rise{to{transform:translateY(-480px);opacity:0}}
@keyframes glitch{0%,91%,100%{text-shadow:3px 0 var(--pink),-3px 0 var(--cyan)}92%{text-shadow:-6px 0 var(--pink),6px 0 var(--cyan)}94%{text-shadow:8px 2px var(--pink),-2px -2px var(--cyan)}96%{text-shadow:-3px 0 var(--pink),3px 0 var(--cyan)}}
@media (prefers-reduced-motion:reduce){.lbrow,h1{animation:none}.bub{display:none}}
@media (max-width:520px){.lbrow:first-child{grid-template-columns:26px 56px 1fr auto;padding:14px 10px}.lbrow:first-child .av{width:56px;height:56px}.lbrow:first-child .big{font-size:32px}.lbrow:first-child b{font-size:20px}.lbrow:first-child .tag{display:none}}

/* phone pass */
.rc td.l,.rc th.l{position:sticky;left:0;z-index:1;background:#0A1329}
td.num{white-space:nowrap}
.swipe{display:none;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--cyan)}
@media (max-width:520px){
  #app{padding:22px 14px 80px;gap:30px}
  nav{gap:14px} nav a{font-size:10px;letter-spacing:.1em}
  .sea{height:480px}.water{bottom:92px}
  .lab{bottom:-44px}.col:nth-child(even) .lab{bottom:-82px}
  .lab b{font-size:9px;letter-spacing:.04em}.lab i{font-size:15px}
  .col:nth-child(even)::after{content:"";position:absolute;left:50%;bottom:-40px;height:36px;border-left:1px dotted var(--c);opacity:.5}
  .lbrow:first-child{box-shadow:4px 4px 0 rgba(255,210,63,.22)}
  .swipe{display:block}
  .grade{min-width:46px;padding:7px 2px}.grade b{font-size:17px}
  table{border-spacing:3px}
  .nm{display:none}
  td.num{font-size:12px}
  .chip{width:29px;height:29px;font-size:14px}
  .duel{gap:10px 6px}.duel .v{font-size:19px}
  .erow{grid-template-columns:16px 1fr 104px}
}
</style>
</head>

    if(ch.length===7&&!/[a-z0-9]/i.test(l)){
      const r={p:name,num,d:num?numToDate(num):date,total};let q=ch.map(c=>known[c]);const unk=[...new Set(ch.filter(c=>known[c]==null))];
      if(unk.length&&total!=null&&unk.length<=2){const ks=q.reduce((a,v)=>a+(v||0),0);const opts=[15,100,0,10,30,60,85];
        outer:for(const a of opts)for(const b of unk.length>1?opts:[0]){const s=ks+ch.filter(c=>c===unk[0]).length*a+(unk[1]?ch.filter(c=>c===unk[1]).length*b:0);if(s===total&&(!unk[1]||a!==b)){known[unk[0]]=a;if(unk[1])known[unk[1]]=b;r.learn=1;break outer}}
        q=ch.map(c=>known[c])}
      if(!name)r.err='No name above this score';else if(!r.d)r.err='No Krillion number or date';else if(q.some(v=>v==null))r.err='Unrecognized emoji '+unk.join(' ');
      else{r.q=q;if(total!=null&&total!==q.reduce((a,b)=>a+b,0))r.warn=`emoji add to ${q.reduce((a,b)=>a+b,0)}, share says ${total}`}
      out.push(r);name=null;total=null}
  }
  return {out,known};
}
function pvPaste(){const {out}=parsePaste($('#paste').value);parsed=out;$('#paste-pv').innerHTML=out.length?out.map(r=>`<div class="row" style="gap:6px;margin-top:6px">${r.p?av(r.p,1):''}<span style="min-width:74px">${r.p?esc(r.p.short):'?'}</span>${r.q?r.q.map(chip).join('')+` <b class="num">${fm(r.q.reduce((a,b)=>a+b,0)*10)} m</b> <span>${dayName(r.d)}</span>`:''}${r.err?`<span class="err">${esc(r.err)}</span>`:''}${r.warn?`<span class="err">${esc(r.warn)}</span>`:''}</div>`).join(''):($('#paste').value.trim()?'<span class="err">No scores found yet. Each share needs a name, then the emoji row.</span>':'')}

function recap(c){
  const r=ranked(c),md=['🥇','🥈','🥉'],aw=awards(c);
  return `🌊 KRILLION CLUB · ${rangeName(c.m)}\n${c.dates.length} day${c.dates.length>1?'s':''} of diving\n\n`+r.map((s,i)=>`${md[i]||(i+1)+'.'} ${s.p.e} ${s.p.name} · ${fm(s.avg*10)} m avg · ${s.n} dive${s.n>1?'s':''} · overall ${s.qavg!=null?grade(s.qavg):'n/a'}`).join('\n')+`\n\n🏆 TROPHIES\n`+aw.map(a=>`${a.title}: ${a.who} (${a.line})`).join('\n');
}

/* ---------- shell ---------- */
const TABS=[['standings','Standings',vStandings],['report-card','Report card',vReport],['dive-log','Dive log',vLog],['head-to-head','Head to head',vDuel],['log-scores','Log scores',vEnter]];
function render(){
  const tabs=TABS.filter(t=>owner||t[0]!=='log-scores'),ms=months(),tab=tabs.find(t=>'#'+t[0]===location.hash)||tabs[0];
  if(ui.range!=='all'&&!ms.includes(ui.range))ui.range='all';
  const c=ms.length?calc(ui.range):null;
  const body=tab[0]==='log-scores'?vEnter():(c&&c.list.length?tab[2](c):`<section class="panel"><h2>No dives logged yet</h2><p class="dim">Scores will show up here once the first day is logged.</p></section>`);
  $('#app').innerHTML=`<header class="head"><div><p>Seven divers · seven prompts a day</p><h1>Krillion Club</h1></div>
  ${ms.length>1?`<select id="month" aria-label="Time range"><option value="all" ${ui.range==='all'?'selected':''}>All time</option>${[...ms].reverse().map(m=>`<option value="${m}" ${m===ui.range?'selected':''}>${monthName(m)}</option>`).join('')}</select>`:''}</header>
  <nav>${tabs.map(t=>`<a href="#${t[0]}" class="${t===tab?'on':''}">${t[1]}</a>`).join('')}</nav>${body}`;
  if(tab[0]==='log-scores')state.players.forEach(p=>pvScore(p.id));
  if(tab[0]==='standings'&&c&&c.list.length)countUp();
  const on=$('.strip .on');if(on)on.parentNode.scrollLeft=on.offsetLeft-on.parentNode.clientWidth/2;
  keepUi();
}
const calm=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(){if(calm())return;const t0=performance.now(),els=[...document.querySelectorAll('[data-count]')];
  (function step(t){const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,3);for(const el of els)el.textContent=fm(el.dataset.count*e);if(k<1)requestAnimationFrame(step)})(t0)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
function buildDoc(){
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Krillion Club</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">\n<style id="css">'+document.getElementById('css').textContent+'</style>\n</head>\n<body>\n<div id="app"></div>\n<div id="toast" role="status"></div>\n<script id="state" type="application/json">'+json+'<\/script>\n<script id="js">'+document.getElementById('js').textContent+'<\/script>\n</body>\n</html>\n';
}
function persist(msg){
  if(!owner)return toast('Only Jay can log scores.');
  state.rev++;try{localStorage.setItem('krillion-league',JSON.stringify(state))}catch(e){}
  render();
  if(artifact)artifact.publish(buildDoc()).then(()=>toast(msg)).catch(e=>{const c=String(e&&(e.code||e.message)||e);toast(/not_writer|not_granted/.test(c)?'Saved on this device only. Only the owner can save for everyone.':/conflict/.test(c)?'Someone else just saved. Check the page and try again.':msg+' (on this device)')});
  else toast(msg+' (on this device)');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.metric){ui.metric=d.metric;render()}
  else if(d.day){ui.day=d.day;render()}
  else if(d.act==='recap'){const txt=recap(calc(ui.range));navigator.clipboard.writeText(txt).then(()=>toast('Recap copied. Paste it in the chat.')).catch(()=>{const p=b.closest('.panel');if(!p.querySelector('#recap-txt'))p.insertAdjacentHTML('beforeend','<textarea id="recap-txt" aria-label="Recap text"></textarea>');p.querySelector('#recap-txt').value=txt;toast('Select the text below and copy it.')})}
  else if(d.act==='import'){const ok=parsed.filter(r=>r.q);if(!ok.length)return toast('Nothing to save yet.');
    const {known}=parsePaste($('#paste').value);for(const k in known)if(EMO[k]==null)state.emo[k]=known[k];
    for(const r of ok){const day=state.days[r.d]||(state.days[r.d]={prompts:[],scores:{}});day.n=r.num||dateToNum(r.d);day.scores[r.p.id]={q:r.q}}
    ui.range='all';ui.day=ok[ok.length-1].d;ui.edate=ui.day;parsed=[];persist(`Saved ${ok.length} score${ok.length>1?'s':''}`)}
  else if(d.act==='save-day'){const dt=ui.edate,scores={};let bad=0;
    for(const p of state.players){const r=parseScore($('#e-s-'+p.id).value);if(r.err)bad++;else if(r.e)scores[p.id]=r.e}
    if(bad)return toast('Fix the highlighted scores first.');
    const prompts=[0,1,2,3,4,5,6].map(i=>({t:$('#e-p'+i).value.trim(),g:$('#e-g'+i).value}));
    if(!Object.keys(scores).length)return toast('Add at least one score.');
    state.days[dt]={n:dateToNum(dt),prompts,scores};ui.range='all';ui.day=dt;persist('Day saved')}
  else if(d.act==='del-day'){if(b.dataset.sure){delete state.days[ui.edate];persist('Day deleted')}else{b.dataset.sure=1;b.textContent='Tap again to delete'}}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.score)pvScore(t.dataset.score);
  else if(t.id==='paste')pvPaste();
  else if(t.dataset.prompt){const s=$('#e-g'+t.dataset.prompt);if(!s.dataset.manual){const g=GUESS.find(x=>x[1].test(t.value+' '));s.value=g?g[0]:''}}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='month'){ui.range=t.value;ui.day=null;render()}
  else if(t.id==='e-date'&&t.value){ui.edate=t.value;render()}
  else if(t.dataset.duel){ui[t.dataset.duel]=t.value;render()}
  else if(/^e-g\d$/.test(t.id))t.dataset.manual=1;
});
window.addEventListener('hashchange',render);
render();
})();
</script>
